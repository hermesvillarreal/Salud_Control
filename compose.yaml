services:
  db:
    image: postgres:16
    container_name: salud-control-db
    environment:
      POSTGRES_USER: salud_user
      POSTGRES_PASSWORD: salud_password
      POSTGRES_DB: salud_control
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U salud_user -d salud_control" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: salud-control-backend
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql://salud_user:salud_password@db:5432/salud_control
      - TELEGRAM_BOT_TOKEN=8585112459:AAG-ZZnfe0sxA31_ct3l7K-VcJXN8HQxfLI
      - GEMINI_API_KEY=[GCP_API_KEY]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    container_name: salud-control-frontend
    ports:
      - "84:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

  telegram-bot:
    build: ./backend
    container_name: salud-control-bot
    command: python run_bot.py
    environment:
      - DATABASE_URL=postgresql://salud_user:salud_password@db:5432/salud_control
      - TELEGRAM_BOT_TOKEN=8585112459:AAG-ZZnfe0sxA31_ct3l7K-VcJXN8HQxfLI
      - GEMINI_API_KEY=[GCP_API_KEY]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
