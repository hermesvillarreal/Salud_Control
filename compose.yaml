services:
  db:
    image: postgres:16
    container_name: salud-control-db
    environment:
      POSTGRES_USER: salud_user
      POSTGRES_PASSWORD: salud_password
      POSTGRES_DB: salud_control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: salud-control-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://salud_user:salud_password@db:5432/salud_control
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: salud-control-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
